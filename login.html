<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Entrar — LogiStock</title><link rel="stylesheet" href="auth.css"><script src="auth.js" defer></script></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="login.html" aria-label="LogiStock"><span class="brand-symbol">L</span><span class="brand-name">Logi<span>Stock</span></span></a><p class="auth-tagline">CONTROLE DE ESTOQUE INTELIGENTE</p>
<form id="loginForm" class="auth-form" novalidate><h1>Bem-vindo de volta</h1><p class="muted">Entre na sua conta para continuar.</p>
<label class="field"><span class="field-icon">✉</span><input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required></label>
<label class="field"><span class="field-icon">♙</span><input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" required><button class="toggle-password" type="button" data-toggle="password" aria-label="Mostrar senha">◉</button></label>
<p class="hint">Use o e-mail cadastrado e sua senha.</p><p class="message" id="message" role="alert" aria-live="polite"></p><button class="primary-btn" type="submit"><span>↪</span> Login</button>
<div class="separator"><span></span>ou<span></span></div><button class="google-btn" type="button" id="googleBtn"><b class="google-g">G</b> Login com o Google</button><p class="bottom-link">Não tem uma conta?<br><a href="register.html">Registre-se <span>→</span></a></p><p class="demo-note">Demonstração front-end • não use uma senha real</p></form></main></body></html>
